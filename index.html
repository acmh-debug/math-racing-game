<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小六分數小數互化體感賽車 - 趣味車款與賽道美化版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0; padding: 0;
            background-color: #0b0c10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px; height: 600px;
            background: #1f2833;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(102, 252, 241, 0.2);
            border: 2px solid #45a29e;
        }
        canvas { width: 100%; height: 100%; display: block; }
        #webcam-container {
            position: absolute; top: 15px; right: 15px;
            width: 140px; height: 105px;
            border-radius: 10px; overflow: hidden;
            border: 2px solid #66fcf1; background: #000; z-index: 10;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 800px; height: 600px;
            background: rgba(11, 12, 16, 0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 20; padding: 20px;
        }
        .form-group {
            display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center;
        }
        input, select {
            padding: 10px 14px; font-size: 16px; border-radius: 8px;
            border: 2px solid #66fcf1; background: #1f2833; color: white;
            outline: none; text-align: center;
        }
        .btn {
            background: linear-gradient(135deg, #ff007f, #ff4757); color: white; border: none;
            padding: 12px 38px; font-size: 22px; font-weight: bold;
            border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        
        .sm-btn {
            padding: 4px 10px; font-size: 13px; border-radius: 6px; border: none;
            cursor: pointer; font-weight: bold; margin: 0 2px;
        }
        .btn-edit { background: #eccc68; color: #000; }
        .btn-del { background: #ff4757; color: #fff; }

        table {
            width: 95%; border-collapse: collapse; margin-top: 10px;
            background: #1f2833; border-radius: 8px; overflow: hidden; font-size: 14px;
        }
        th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #0b0c10; }
        th { background: #45a29e; color: #0b0c10; font-weight: bold; }

        #recalibrate-btn {
            position: absolute; bottom: 15px; right: 15px;
            background: #45a29e; color: #0b0c10; border: none;
            padding: 8px 16px; border-radius: 20px; font-weight: bold;
            cursor: pointer; z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #teacher-btn {
            position: absolute; top: 15px; left: 15px;
            background: rgba(69, 162, 158, 0.3); color: #66fcf1;
            border: 1px solid #66fcf1; padding: 6px 12px; border-radius: 15px;
            font-size: 13px; cursor: pointer; z-index: 30;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="webcam-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <button id="recalibrate-btn" onclick="recalibrateCenter()">🎯 校準頭部位置</button>
        <button id="teacher-btn" onclick="openTeacherPanel()">⚙️ 老師管理</button>

        <!-- 設定與啟動頁面 -->
        <div id="start-overlay" class="overlay">
            <h1 style="font-size: 32px; margin-bottom: 5px; color: #66fcf1; text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);">🏎️ 小六分數小數互化體感賽車</h1>
            <p style="color: #c5c6c7; margin-bottom: 20px;">分母 2, 4, 5, 8 專題練習｜趣味載具版</p>
            
            <div class="form-group">
                <input type="text" id="student-class" placeholder="班別 (例: 6A)" style="width: 130px;">
                <input type="text" id="student-name" placeholder="學生姓名" style="width: 150px;">
            </div>

            <div class="form-group">
                <label style="align-self: center; font-weight: bold; color: #66fcf1;">載具款式：</label>
                <select id="car-style">
                    <option value="bus">🚌 黃色校車</option>
                    <option value="rocket">🚀 太空火箭</option>
                    <option value="police">🚓 酷炫警車</option>
                    <option value="f1">🏎️ F1 極速賽車</option>
                </select>

                <label style="align-self: center; font-weight: bold; color: #66fcf1; margin-left: 10px;">車身顏色：</label>
                <select id="car-color">
                    <option value="#f1c40f">💛 活力黃</option>
                    <option value="#ff4757">❤️ 經典紅</option>
                    <option value="#1e90ff">💙 炫光藍</option>
                    <option value="#2ed573">💚 疾速綠</option>
                    <option value="#ff6b81">💖 櫻花粉</option>
                </select>
            </div>

            <button class="btn" onclick="startGame()" style="margin-top: 15px;">點擊發動引擎 🚀</button>
            <div id="loading-text" style="color: #66fcf1; margin-top: 10px;"></div>
        </div>

        <!-- 英雄榜頁面 -->
        <div id="end-overlay" class="overlay" style="display: none;">
            <h2 id="end-title" style="font-size: 30px; margin: 0 0 5px 0; color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);">🎉 挑戰結束！</h2>
            <p id="final-score-text" style="font-size: 22px; margin-bottom: 10px; color: #66fcf1;"></p>
            
            <div style="display: flex; justify-content: space-between; width: 95%; align-items: center;">
                <h3 style="margin: 5px 0; color: #ffda79;">🏆 班級英雄榜 (Top 10)</h3>
                <button id="clear-all-btn" class="sm-btn btn-del" onclick="clearAllData()" style="display: none; padding: 6px 12px;">🗑️ 一鍵清空所有紀錄</button>
            </div>

            <div style="max-height: 280px; overflow-y: auto; width: 100%; display: flex; justify-content: center;">
                <table id="leaderboard-table">
                    <thead>
                        <tr><th>名次</th><th>日期</th><th>班別</th><th>姓名</th><th>得分</th><th class="admin-col" style="display:none;">操作</th></tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>

            <button class="btn" onclick="restartGame()" style="margin-top: 15px;">返回主選單 🔄</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let model = null, video = null;

        let studentInfo = { name: "", class: "", date: "" };
        let selectedCarColor = "#f1c40f";
        let selectedCarStyle = "bus";

        let score = 0, timeLeft = 60, gameActive = false, isCalibrated = false;
        let comboCount = 0;
        let particles = [];
        let floatingTexts = [];
        let helperHint = "";

        let isAdminMode = false;
        let currentLane = 1;
        const laneXPositions = [133, 400, 666];

        let currentProblem = { question: "", options: [], correctLane: 1, tip: "" };
        let obstacleY = -60, obstacleSpeed = 3.2;
        let roadOffset = 0, tickCount = 0;
        let statusMsg = "請面向鏡頭正中間進行校準...";
        let baseCenterX = null;
        const sensitivityThreshold = 18;

        // 音效系統
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.25);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.05); osc.stop(now + idx * 0.05 + 0.25);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.3);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'engine') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'calibrate') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'finish') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 3,
                    color: ['#ffda79', '#66fcf1', '#ff4757', '#ffffff'][Math.floor(Math.random() * 4)],
                    size: Math.random() * 6 + 3, alpha: 1.0
                });
            }
        }

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x: x, y: y, text: text, color: color, alpha: 1.0, vy: -2 });
        }

        const fractionData = [
            { frac: "1/2", dec: "0.5" },
            { frac: "1/4", dec: "0.25" }, { frac: "3/4", dec: "0.75" },
            { frac: "1/5", dec: "0.2" }, { frac: "2/5", dec: "0.4" },
            { frac: "3/5", dec: "0.6" }, { frac: "4/5", dec: "0.8" },
            { frac: "1/8", dec: "0.125" }, { frac: "3/8", dec: "0.375" },
            { frac: "5/8", dec: "0.625" }, { frac: "7/8", dec: "0.875" }
        ];

        function recalibrateCenter() {
            baseCenterX = null;
            isCalibrated = false;
            statusMsg = "🎯 正在重新校準正中心...";
        }

        function generateProblem() {
            const isFracToDec = Math.random() > 0.5;
            const target = fractionData[Math.floor(Math.random() * fractionData.length)];

            let questionText, correctAnswer;
            if (isFracToDec) {
                questionText = `${target.frac} = ?`;
                correctAnswer = target.dec;
            } else {
                questionText = `${target.dec} = ?`;
                correctAnswer = target.frac;
            }

            const correctLane = Math.floor(Math.random() * 3);
            const options = ["", "", ""];
            options[correctLane] = correctAnswer;

            for (let i = 0; i < 3; i++) {
                if (i !== correctLane) {
                    let fake;
                    do {
                        const randomItem = fractionData[Math.floor(Math.random() * fractionData.length)];
                        fake = isFracToDec ? randomItem.dec : randomItem.frac;
                    } while (fake === correctAnswer || options.includes(fake));
                    options[i] = fake;
                }
            }

            currentProblem = { 
                question: questionText, options: options, 
                correctLane: correctLane, tip: `${target.frac} ＝ ${target.dec}`
            };
            obstacleY = -60;
        }

        async function startGame() {
            initAudio();

            const nameInput = document.getElementById('student-name').value.trim();
            const classInput = document.getElementById('student-class').value.trim();

            if (!nameInput || !classInput) {
                alert("請先輸入『班別』與『學生姓名』！");
                return;
            }

            selectedCarColor = document.getElementById('car-color').value;
            selectedCarStyle = document.getElementById('car-style').value;

            const today = new Date();
            studentInfo = {
                name: nameInput, class: classInput,
                date: `${today.getMonth() + 1}/${today.getDate()}`
            };

            playSound('engine');
            document.getElementById('start-overlay').style.display = 'none';

            score = 0; timeLeft = 60; isCalibrated = false; isAdminMode = false;
            comboCount = 0; helperHint = "";
            generateProblem();

            requestAnimationFrame(gameLoop);

            try {
                video = document.getElementById('webcam');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 160, height: 120, facingMode: 'user' }, audio: false
                });
                video.srcObject = stream;
                await new Promise(r => video.onloadedmetadata = r);
                video.play();

                statusMsg = "載入 AI 模型中...";
                model = await blazeface.load();
                statusMsg = "請保持頭部面向正中間進行校準...";
                
                detectPoseLoop();
            } catch (err) {
                console.error(err);
                statusMsg = "⚠️ 體感無效（可用鍵盤 ← → 操作）";
                isCalibrated = true;
                startTimer();
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') currentLane = Math.max(0, currentLane - 1);
                    if (e.key === 'ArrowRight') currentLane = Math.min(2, currentLane + 1);
                });
            }
        }

        function startTimer() {
            gameActive = true;
            const timer = setInterval(() => {
                if (gameActive && timeLeft > 0) {
                    timeLeft--;
                } else if (timeLeft === 0) {
                    gameActive = false;
                    clearInterval(timer);
                    endGame();
                }
            }, 1000);
        }

        async function detectPoseLoop() {
            if (model && video && video.readyState >= 2) {
                try {
                    const predictions = await model.estimateFaces(video, false, false, 0.2);
                    if (predictions.length > 0) {
                        const face = predictions[0];
                        const currentX = (face.topLeft[0] + face.bottomRight[0]) / 2;

                        if (baseCenterX === null) {
                            baseCenterX = currentX;
                            playSound('calibrate');
                            statusMsg = "✅ 校準成功！比賽開始！";
                            isCalibrated = true;
                            startTimer();
                        }

                        const deltaX = currentX - baseCenterX;

                        if (deltaX > sensitivityThreshold) currentLane = 0;
                        else if (deltaX < -sensitivityThreshold) currentLane = 2;
                        else currentLane = 1;
                    }
                } catch (e) { console.error(e); }
            }
            if (!gameActive || !isCalibrated) requestAnimationFrame(detectPoseLoop);
            else requestAnimationFrame(detectPoseLoop);
        }

        // 🎨 畫炫彩答案格與裝飾金幣/箭頭
        function drawOptionBlock(x, y, text) {
            const w = 140, h = 55, r = 12;
            ctx.save();
            ctx.translate(x - w / 2, y);

            // 邊緣旋轉金幣飾品
            ctx.fillStyle = "#ffda79";
            ctx.beginPath();
            ctx.arc(-15, h / 2, 8, 0, Math.PI * 2);
            ctx.arc(w + 15, h / 2, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = "#66fcf1";
            ctx.shadowBlur = 12;

            const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, "#1f2833");
            bgGrad.addColorStop(1, "#0b0c10");
            ctx.fillStyle = bgGrad;

            ctx.beginPath();
            ctx.roundRect(0, 0, w, h, r);
            ctx.fill();

            const borderGrad = ctx.createLinearGradient(0, 0, w, h);
            borderGrad.addColorStop(0, "#66fcf1");
            borderGrad.addColorStop(0.5, "#45a29e");
            borderGrad.addColorStop(1, "#1f2833");
            ctx.strokeStyle = borderGrad;
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.shadowBlur = 0;

            ctx.font = "bold 26px Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillText(text, w / 2 + 2, h / 2 + 2);

            ctx.fillStyle = "#ffffff";
            ctx.fillText(text, w / 2, h / 2);

            ctx.restore();
        }

        // 🏎️/🚌/🚀/🚓 趣味主題載具繪製引擎
        function drawVehicle(x, y, color, style) {
            ctx.save();
            ctx.translate(x, y);

            tickCount++;

            // 陰影
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.beginPath();
            ctx.ellipse(0, 15, 32, 48, 0, 0, Math.PI * 2);
            ctx.fill();

            if (style === 'bus') { // 🚌 黃色校車
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.roundRect(-24, -45, 48, 85, 8); ctx.fill();

                // 車頂與窗戶
                ctx.fillStyle = "#111";
                ctx.fillRect(-20, -35, 40, 12); // 前擋風玻璃
                ctx.fillRect(-20, -15, 3, 40);  // 側窗
                ctx.fillRect(17, -15, 3, 40);

                // 校車黑條與標誌
                ctx.fillStyle = "#000";
                ctx.fillRect(-24, -5, 48, 6);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
                ctx.fillText("SCHOOL BUS", 0, 0);

                // 閃爍校車燈
                ctx.fillStyle = (tickCount % 20 < 10) ? "#ff4757" : "#1e90ff";
                ctx.beginPath();
                ctx.arc(-16, -42, 4, 0, Math.PI * 2);
                ctx.arc(16, -42, 4, 0, Math.PI * 2);
                ctx.fill();

            } else if (style === 'rocket') { // 🚀 太空火箭
                // 噴射火焰動畫
                const fireH = Math.random() * 20 + 20;
                const fireGrad = ctx.createLinearGradient(0, 35, 0, 35 + fireH);
                fireGrad.addColorStop(0, "#ffda79");
                fireGrad.addColorStop(0.5, "#ff4757");
                fireGrad.addColorStop(1, "transparent");
                ctx.fillStyle = fireGrad;
                ctx.beginPath();
                ctx.moveTo(-12, 35); ctx.lineTo(0, 35 + fireH); ctx.lineTo(12, 35);
                ctx.fill();

                // 火箭主體
                ctx.fillStyle = "#e0e0e0";
                ctx.beginPath();
                ctx.moveTo(0, -50); ctx.lineTo(18, -10); ctx.lineTo(18, 35); ctx.lineTo(-18, 35); ctx.lineTo(-18, -10);
                ctx.closePath(); ctx.fill();

                // 彈頭顏色
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(18, -10); ctx.lineTo(-18, -10); ctx.closePath(); ctx.fill();

                // 機翼
                ctx.fillStyle = color;
                ctx.fillRect(-26, 15, 8, 20); ctx.fillRect(18, 15, 8, 20);

                // 圓形舷窗
                ctx.fillStyle = "#66fcf1"; ctx.strokeStyle = "#222"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, 5, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            } else if (style === 'police') { // 🚓 酷炫警車
                ctx.fillStyle = "#111"; // 黑白警車車身
                ctx.beginPath(); ctx.roundRect(-22, -40, 44, 80, 10); ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-22, -15, 44, 30); // 中間白色

                // 警車頭與車窗
                ctx.fillStyle = "#222"; ctx.fillRect(-18, -30, 36, 12);

                // 動態警燈 (紅藍交替閃爍)
                const isRedLeft = Math.floor(tickCount / 10) % 2 === 0;
                ctx.fillStyle = isRedLeft ? "#ff4757" : "#1e90ff"; ctx.fillRect(-12, -8, 10, 5);
                ctx.fillStyle = isRedLeft ? "#1e90ff" : "#ff4757"; ctx.fillRect(2, -8, 10, 5);

                // POLICE 文字
                ctx.fillStyle = "#ffffff"; ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
                ctx.fillText("POLICE", 0, 4);

            } else { // 🏎️ F1 極速賽車
                ctx.fillStyle = "#111";
                ctx.fillRect(-30, -25, 10, 18); ctx.fillRect(20, -25, 10, 18); // 超寬後輪
                ctx.fillRect(-30, 15, 10, 20); ctx.fillRect(20, 15, 10, 20);

                const carGrad = ctx.createLinearGradient(-20, 0, 20, 0);
                carGrad.addColorStop(0, color); carGrad.addColorStop(0.5, "#ffffff"); carGrad.addColorStop(1, color);
                ctx.fillStyle = carGrad;

                ctx.beginPath();
                ctx.moveTo(0, -48); ctx.lineTo(16, -10); ctx.lineTo(14, 35); ctx.lineTo(-14, 35); ctx.lineTo(-16, -10);
                ctx.closePath(); ctx.fill();

                // F1 大尾翼
                ctx.fillStyle = "#222"; ctx.fillRect(-26, 32, 52, 8);
            }

            ctx.restore();
        }

        function gameLoop() {
            ctx.fillStyle = "#0b0c10";
            ctx.fillRect(0, 0, 800, 600);

            // 動態跑道與條紋
            roadOffset = (roadOffset + obstacleSpeed) % 40;
            ctx.strokeStyle = "rgba(102, 252, 241, 0.15)";
            ctx.lineWidth = 2;

            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(266, 0); ctx.lineTo(266, 600);
            ctx.moveTo(533, 0); ctx.lineTo(533, 600);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = "#45a29e"; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(10, 0); ctx.lineTo(10, 600);
            ctx.moveTo(790, 0); ctx.lineTo(790, 600);
            ctx.stroke();

            if (!isCalibrated) {
                ctx.fillStyle = "rgba(11, 12, 16, 0.7)";
                ctx.fillRect(0, 0, 800, 600);

                ctx.fillStyle = "#66fcf1"; ctx.font = "bold 32px Arial"; ctx.textAlign = "center";
                ctx.fillText("🎯 正在校準頭部正中心...", 400, 260);
                ctx.font = "20px Arial"; ctx.fillStyle = "#c5c6c7";
                ctx.fillText("請面向螢幕正中間保持不動", 400, 310);

                const carX = laneXPositions[currentLane];
                drawVehicle(carX, 490, selectedCarColor, selectedCarStyle);
                requestAnimationFrame(gameLoop);
                return;
            }

            if (gameActive) {
                obstacleY += obstacleSpeed;

                for (let i = 0; i < 3; i++) {
                    drawOptionBlock(laneXPositions[i], obstacleY, currentProblem.options[i]);
                }

                const carX = laneXPositions[currentLane];

                if (obstacleY >= 440 && obstacleY <= 490) {
                    if (currentLane === currentProblem.correctLane) {
                        comboCount++;
                        const bonusScore = 10 + (comboCount > 1 ? comboCount * 2 : 0);
                        score += bonusScore;
                        
                        playSound('correct');
                        createExplosion(carX, 470);
                        
                        if (comboCount > 1) {
                            addFloatingText(carX, 430, `🔥 ${comboCount} COMBO! +${bonusScore}`, "#ffda79");
                        } else {
                            addFloatingText(carX, 430, `+10`, "#66fcf1");
                        }

                        helperHint = "";
                        generateProblem();
                    } else {
                        comboCount = 0;
                        score = Math.max(0, score - 5);
                        playSound('wrong');
                        addFloatingText(carX, 430, `-5`, "#ff4757");

                        helperHint = `💡 複習小提示：${currentProblem.tip}`;
                        obstacleY = -60;
                    }
                } else if (obstacleY > 600) {
                    obstacleY = -60;
                }

                drawVehicle(carX, 490, selectedCarColor, selectedCarStyle);

                // 粒子動畫
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
                    if (p.alpha <= 0) particles.splice(i, 1);
                    else {
                        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }
                }

                // 浮空文字
                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    let ft = floatingTexts[i];
                    ft.y += ft.vy; ft.alpha -= 0.02;
                    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
                    else {
                        ctx.font = "bold 24px Arial"; ctx.fillStyle = ft.color; ctx.globalAlpha = ft.alpha;
                        ctx.textAlign = "center"; ctx.fillText(ft.text, ft.x, ft.y);
                        ctx.globalAlpha = 1.0;
                    }
                }

                // 頂部科技 HUD
                ctx.fillStyle = "rgba(31, 40, 51, 0.85)";
                ctx.beginPath(); ctx.roundRect(150, 10, 500, 75, 12); ctx.fill();
                ctx.strokeStyle = "#66fcf1"; ctx.lineWidth = 1.5; ctx.stroke();

                ctx.fillStyle = "#66fcf1"; ctx.font = "bold 26px Arial"; ctx.textAlign = "center";
                ctx.fillText(`題目：${currentProblem.question}`, 400, 42);

                ctx.font = "14px Arial";
                ctx.fillStyle = helperHint ? "#ffda79" : "#c5c6c7";
                ctx.fillText(helperHint || statusMsg, 400, 70);

                ctx.font = "bold 18px Arial"; ctx.fillStyle = "#ffffff"; ctx.textAlign = "left";
                ctx.fillText(`得分: ${score}`, 25, 35);
                ctx.fillText(`時間: ${timeLeft}s`, 25, 65);
                ctx.fillText(`學生: ${studentInfo.class} ${studentInfo.name}`, 25, 95);

                if (comboCount > 1) {
                    ctx.fillStyle = "#ffda79";
                    ctx.fillText(`🔥 ${comboCount} 連擊`, 25, 125);
                }

                requestAnimationFrame(gameLoop);
            }
        }

        function endGame() {
            playSound('finish');

            saveToLeaderboard({
                name: studentInfo.name, class: studentInfo.class,
                date: studentInfo.date, score: score
            });

            document.getElementById('end-title').innerText = "🎉 挑戰結束！";
            document.getElementById('final-score-text').innerText = `${studentInfo.class} ${studentInfo.name} 最終得分：${score} 分`;
            isAdminMode = false;
            updateLeaderboardUI();
            document.getElementById('end-overlay').style.display = 'flex';
        }

        function saveToLeaderboard(newEntry) {
            let list = JSON.parse(localStorage.getItem('math_racing_leaderboard') || '[]');
            list.push(newEntry);
            list.sort((a, b) => b.score - a.score);
            list = list.slice(0, 10);
            localStorage.setItem('math_racing_leaderboard', JSON.stringify(list));
        }

        function updateLeaderboardUI() {
            const list = JSON.parse(localStorage.getItem('math_racing_leaderboard') || '[]');
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            const adminCols = document.querySelectorAll('.admin-col');
            const clearBtn = document.getElementById('clear-all-btn');
            
            adminCols.forEach(col => col.style.display = isAdminMode ? 'table-cell' : 'none');
            clearBtn.style.display = isAdminMode ? 'inline-block' : 'none';

            list.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.date}</td>
                    <td>${item.class}</td>
                    <td>${item.name}</td>
                    <td style="color:#ffda79; font-weight:bold;">${item.score}</td>
                    ${isAdminMode ? `
                        <td class="admin-col">
                            <button class="sm-btn btn-edit" onclick="editEntry(${index})">編輯</button>
                            <button class="sm-btn btn-del" onclick="deleteEntry(${index})">刪除</button>
                        </td>
                    ` : ''}
                `;
                tbody.appendChild(tr);
            });
        }

        function openTeacherPanel() {
            const pwd = prompt("請輸入老師管理密碼 (預設: 1234):");
            if (pwd === "1234") {
                isAdminMode = true;
                document.getElementById('end-title').innerText = "⚙️ 排行榜老師管理後台";
                document.getElementById('final-score-text').innerText = "提示：您可以在此修改學生姓名、班別、分數，或刪除單筆紀錄。";
                updateLeaderboardUI();
                document.getElementById('end-overlay').style.display = 'flex';
            } else if (pwd !== null) {
                alert("密碼錯誤！");
            }
        }

        function editEntry(index) {
            let list = JSON.parse(localStorage.getItem('math_racing_leaderboard') || '[]');
            const item = list[index];

            const newClass = prompt("請輸入新的班別:", item.class);
            if (newClass === null) return;

            const newName = prompt("請輸入新的學生姓名:", item.name);
            if (newName === null) return;

            const newScore = prompt("請輸入新的得分:", item.score);
            if (newScore === null) return;

            list[index] = {
                class: newClass.trim(),
                name: newName.trim(),
                score: parseInt(newScore, 10) || 0,
                date: item.date
            };

            list.sort((a, b) => b.score - a.score);
            localStorage.setItem('math_racing_leaderboard', JSON.stringify(list));
            updateLeaderboardUI();
        }

        function deleteEntry(index) {
            if (confirm("確定要刪除這筆紀錄嗎？")) {
                let list = JSON.parse(localStorage.getItem('math_racing_leaderboard') || '[]');
                list.splice(index, 1);
                localStorage.setItem('math_racing_leaderboard', JSON.stringify(list));
                updateLeaderboardUI();
            }
        }

        function clearAllData() {
            if (confirm("⚠️ 確定要一鍵清空整個排行榜嗎？（清空後無法復原）")) {
                localStorage.removeItem('math_racing_leaderboard');
                updateLeaderboardUI();
            }
        }

        function restartGame() {
            document.getElementById('end-overlay').style.display = 'none';
            document.getElementById('start-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
