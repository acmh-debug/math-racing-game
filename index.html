<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學校園體感賽車</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px; height: 600px;
            background: #0f3460;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        #webcam-container {
            position: absolute; top: 15px; right: 15px;
            width: 160px; height: 120px;
            border-radius: 8px; overflow: hidden;
            border: 2px solid #ff4757; background: #000; z-index: 10;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="webcam-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let model, video;

        // 畫畫基本遊戲底圖與跑道
        function drawScene() {
            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, 0, 800, 600);

            // 畫三線道分隔線
            ctx.strokeStyle = "#eccc68";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(266, 0); ctx.lineTo(266, 600);
            ctx.moveTo(533, 0); ctx.lineTo(533, 600);
            ctx.stroke();
        }

        async function init() {
            drawScene();
            
            // 1. 設定相機
            video = document.getElementById('webcam');
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 320, height: 240, facingMode: 'user' },
                audio: false
            });
            video.srcObject = stream;
            await new Promise(r => video.onloadedmetadata = r);
            video.play();

            // 2. 載入 BlazeFace 模型
            model = await blazeface.load();
            
            // 3. 啟動無窮迴圈進行體感偵測
            requestAnimationFrame(detectLoop);
        }

        async function detectLoop() {
            drawScene(); // 先畫背景

            if (model && video && video.readyState >= 2) {
                const predictions = await model.estimateFaces(video, false);

                if (predictions.length > 0) {
                    const face = predictions[0];
                    const leftEye = face.landmarks[0]; // 取得眼部坐標

                    if (leftEye) {
                        // 計算畫布上的對應坐標（進行鏡像轉換）
                        const targetX = 800 - (leftEye[0] * (800 / video.videoWidth));
                        const targetY = leftEye[1] * (600 / video.videoHeight);

                        // 畫跟隨頭部的紅點
                        ctx.fillStyle = "#ff4757";
                        ctx.beginPath();
                        ctx.arc(targetX, targetY, 25, 0, 2 * Math.PI);
                        ctx.fill();

                        ctx.fillStyle = "#ffffff";
                        ctx.font = "20px Arial";
                        ctx.textAlign = "center";
                        ctx.fillText("✅ 成功控制！請左右移動頭部", 400, 50);
                    }
                } else {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "20px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText("🔍 搜尋人臉中，請面向鏡頭...", 400, 300);
                }
            }

            // 保持持續刷新
            requestAnimationFrame(detectLoop);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
