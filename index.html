<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學校園體感賽車</title>
    <!-- MediaPipe & TensorFlow.js libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Google Sites 嵌入提示列 */
        #iframe-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            text-align: center;
            padding: 12px 10px;
            font-size: 16px;
            font-weight: bold;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #iframe-warning a {
            background-color: #ffffff;
            color: #ff416c;
            padding: 6px 16px;
            margin-left: 12px;
            border-radius: 20px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }

        #iframe-warning a:hover {
            transform: scale(1.05);
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #0f3460;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            margin-top: 20px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 鏡頭視窗 */
        #webcam-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e94560;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background: #000;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 鏡像翻轉 */
        }
    </style>
</head>
<body>

    <!-- 專為 Google Sites 內嵌設計的警告跳轉條 -->
    <div id="iframe-warning">
        ⚠️ 體感鏡頭需要獨立頁面權限！
        <a href="https://acmh-debug.github.io/math-racing-game/" target="_blank">點此開啟全螢幕體感模式 🚀</a>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="webcam-container">
            <!-- 加入 playsinline, autoplay, muted 確保 iOS / iPad 相容 -->
            <video id="webcam" autoplay playsinline muted></video>
        </div>
    </div>

    <script>
        // 1. 自動偵測是否處於 Google Sites 或其他 iframe 內
        if (window.self !== window.top) {
            document.getElementById('iframe-warning').style.display = 'block';
        }

        // 2. Google Sheets API 網址設定
        const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbx0W-bfZwnHUbcuicaxQq8OsSLKCPzkS21pVG3vg2lxAA0cq7tzDt0IhxnHSCUIzecqgA/exec";

        // 初始化攝影機
        async function setupCamera() {
            const video = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 320, height: 240, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve(video);
                    };
                });
            } catch (err) {
                console.error("無法讀取攝影機: ", err);
            }
        }

        window.addEventListener('load', async () => {
            await setupCamera();
        });
    </script>
</body>
</html>
