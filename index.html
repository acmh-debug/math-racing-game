<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學校園體感賽車</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px; height: 600px;
            background: #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas { width: 100%; height: 100%; display: block; }
        #webcam-container {
            position: absolute; top: 15px; right: 15px;
            width: 140px; height: 105px;
            border-radius: 8px; overflow: hidden;
            border: 2px solid #ff4757; background: #000; z-index: 10;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="webcam-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let model, video;

        // 遊戲狀態變數
        let score = 0;
        let timeLeft = 60;
        let gameActive = false;
        let currentLane = 1; // 0: 左, 1: 中, 2: 右
        let laneXPositions = [133, 400, 666]; // 跑道中心 X 座標

        // 題目與障礙物狀態
        let currentProblem = { question: "準備中...", options: [0, 0, 0], correctLane: 1 };
        let obstacleY = -50;
        let obstacleSpeed = 4;

        // 產生隨機數學題目 (加減法)
        function generateProblem() {
            const a = Math.floor(Math.random() * 20) + 1;
            const b = Math.floor(Math.random() * 20) + 1;
            const isAddition = Math.random() > 0.5;
            
            const questionText = isAddition ? `${a} + ${b} = ?` : `${Math.max(a, b)} - ${Math.min(a, b)} = ?`;
            const correctAnswer = isAddition ? a + b : Math.max(a, b) - Math.min(a, b);

            const correctLane = Math.floor(Math.random() * 3);
            const options = [0, 0, 0];

            options[correctLane] = correctAnswer;
            for (let i = 0; i < 3; i++) {
                if (i !== correctLane) {
                    let fakeAnswer;
                    do {
                        fakeAnswer = correctAnswer + (Math.floor(Math.random() * 10) - 5);
                    } while (fakeAnswer === correctAnswer || fakeAnswer < 0 || options.includes(fakeAnswer));
                    options[i] = fakeAnswer;
                }
            }

            currentProblem = { question: questionText, options: options, correctLane: correctLane };
            obstacleY = -50; // 重置障礙物位置
        }

        async function init() {
            video = document.getElementById('webcam');
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 320, height: 240, facingMode: 'user' }, audio: false
            });
            video.srcObject = stream;
            await new Promise(r => video.onloadedmetadata = r);
            video.play();

            model = await blazeface.load();

            // 開始倒數計時
            generateProblem();
            gameActive = true;
            setInterval(() => {
                if (gameActive && timeLeft > 0) timeLeft--;
                if (timeLeft === 0) gameActive = false;
            }, 1000);

            requestAnimationFrame(gameLoop);
        }

        async function gameLoop() {
            // 1. 繪製跑道與背景
            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, 0, 800, 600);

            // 跑道線
            ctx.strokeStyle = "#eccc68";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(266, 0); ctx.lineTo(266, 600);
            ctx.moveTo(533, 0); ctx.lineTo(533, 600);
            ctx.stroke();

            // 2. 體感偵測頭部位置
            if (model && video && video.readyState >= 2) {
                const predictions = await model.estimateFaces(video, false, false, 0.3);
                if (predictions.length > 0) {
                    const face = predictions[0];
                    const centerX = (face.topLeft[0] + face.bottomRight[0]) / 2;
                    const targetX = 800 - (centerX * (800 / video.videoWidth));

                    // 依據頭部 X 位置判斷切換至哪條跑道
                    if (targetX < 266) currentLane = 0; // 左跑道
                    else if (targetX > 533) currentLane = 2; // 右跑道
                    else currentLane = 1; // 中跑道
                }
            }

            if (gameActive) {
                // 3. 更新與繪製題目障礙物
                obstacleY += obstacleSpeed;

                for (let i = 0; i < 3; i++) {
                    // 繪製選項方塊
                    ctx.fillStyle = (i === currentProblem.correctLane) ? "#2ed573" : "#ff4757";
                    ctx.fillRect(laneXPositions[i] - 50, obstacleY, 100, 50);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 24px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(currentProblem.options[i], laneXPositions[i], obstacleY + 33);
                }

                // 碰撞檢測 (賽車固定在 Y: 500 的位置)
                if (obstacleY >= 460 && obstacleY <= 510) {
                    if (currentLane === currentProblem.correctLane) {
                        score += 10;
                    } else {
                        score = Math.max(0, score - 5);
                    }
                    generateProblem(); // 生成新題目
                } else if (obstacleY > 600) {
                    generateProblem(); // 超過畫面生成新題目
                }

                // 4. 繪製玩家賽車 (依照 currentLane 決定位置)
                const carX = laneXPositions[currentLane];
                ctx.fillStyle = "#eccc68";
                ctx.shadowColor = "#eccc68";
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(carX, 500, 25, 0, 2 * Math.PI);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 5. 繪製 UI (題目、得分、時間)
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`題目：${currentProblem.question}`, 400, 50);

                ctx.font = "20px Arial";
                ctx.textAlign = "left";
                ctx.fillText(`得分: ${score}`, 30, 40);
                ctx.fillText(`剩餘時間: ${timeLeft}s`, 30, 70);

            } else {
                // 6. 遊戲結束畫面
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, 800, 600);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("🎉 遊戲結束！", 400, 250);
                ctx.fillText(`最終得分：${score} 分`, 400, 320);
                ctx.font = "20px Arial";
                ctx.fillText("重新整理頁面即可再次挑戰", 400, 380);
            }

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
