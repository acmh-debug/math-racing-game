<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學校園體感賽車</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px; height: 600px;
            background: #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas { width: 100%; height: 100%; display: block; }
        #webcam-container {
            position: absolute; top: 15px; right: 15px;
            width: 140px; height: 105px;
            border-radius: 8px; overflow: hidden;
            border: 2px solid #ff4757; background: #000; z-index: 10;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* 啟動按鈕蓋頁 */
        #start-overlay {
            position: absolute; top: 0; left: 0;
            width: 800px; height: 600px;
            background: rgba(15, 52, 96, 0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 20;
        }
        #start-btn {
            background: #ff4757;
            color: white; border: none;
            padding: 15px 40px; font-size: 24px; font-weight: bold;
            border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s;
        }
        #start-btn:hover { transform: scale(1.05); }
        #loading-text { font-size: 20px; color: #eccc68; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="webcam-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div id="start-overlay">
            <h1 style="font-size: 36px; margin-bottom: 10px;">🏎️ 數學校園體感賽車</h1>
            <p style="color: #a4b0be; margin-bottom: 30px;">透過頭部左右移動切換跑道，選擇正確答案！</p>
            <button id="start-btn" onclick="startGame()">點擊開始遊戲 🚀</button>
            <div id="loading-text"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let model, video;

        // 遊戲核心變數
        let score = 0;
        let timeLeft = 60;
        let gameActive = false;
        let currentLane = 1; // 0: 左, 1: 中, 2: 右
        const laneXPositions = [133, 400, 666]; // 跑道中心點坐標

        let currentProblem = { question: "", options: [0, 0, 0], correctLane: 1 };
        let obstacleY = -50;
        let obstacleSpeed = 3.5;

        // 產生隨機加減法題目
        function generateProblem() {
            const a = Math.floor(Math.random() * 15) + 1;
            const b = Math.floor(Math.random() * 15) + 1;
            const isAddition = Math.random() > 0.5;

            const questionText = isAddition ? `${a} + ${b} = ?` : `${Math.max(a, b)} - ${Math.min(a, b)} = ?`;
            const correctAnswer = isAddition ? a + b : Math.max(a, b) - Math.min(a, b);

            const correctLane = Math.floor(Math.random() * 3);
            const options = [0, 0, 0];
            options[correctLane] = correctAnswer;

            for (let i = 0; i < 3; i++) {
                if (i !== correctLane) {
                    let fake;
                    do {
                        fake = correctAnswer + (Math.floor(Math.random() * 9) - 4);
                    } while (fake === correctAnswer || fake < 0 || options.includes(fake));
                    options[i] = fake;
                }
            }

            currentProblem = { question: questionText, options: options, correctLane: correctLane };
            obstacleY = -50;
        }

        async function startGame() {
            const btn = document.getElementById('start-btn');
            const loadingText = document.getElementById('loading-text');
            btn.style.display = 'none';
            loadingText.innerText = '正在連線鏡頭並載入 AI 模型...';

            try {
                // 1. 啟動鏡頭
                video = document.getElementById('webcam');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 320, height: 240, facingMode: 'user' }, audio: false
                });
                video.srcObject = stream;
                await new Promise(r => video.onloadedmetadata = r);
                video.play();

                // 2. 載入模型
                model = await blazeface.load();

                // 3. 隱藏蓋頁，進入遊戲
                document.getElementById('start-overlay').style.display = 'none';
                generateProblem();
                gameActive = true;

                // 倒數計時器
                const timer = setInterval(() => {
                    if (gameActive && timeLeft > 0) {
                        timeLeft--;
                    } else if (timeLeft === 0) {
                        gameActive = false;
                        clearInterval(timer);
                    }
                }, 1000);

                requestAnimationFrame(gameLoop);

            } catch (err) {
                console.error(err);
                loadingText.innerText = '⚠️ 啟動失敗: ' + err.message;
                loadingText.style.color = '#ff4757';
                btn.style.display = 'inline-block';
            }
        }

        async function gameLoop() {
            // 背景與跑道
            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, 0, 800, 600);

            ctx.strokeStyle = "#eccc68";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(266, 0); ctx.lineTo(266, 600);
            ctx.moveTo(533, 0); ctx.lineTo(533, 600);
            ctx.stroke();

            // 體感鏡頭追蹤
            if (model && video && video.readyState >= 2) {
                const predictions = await model.estimateFaces(video, false, false, 0.3);
                if (predictions.length > 0) {
                    const face = predictions[0];
                    const centerX = (face.topLeft[0] + face.bottomRight[0]) / 2;
                    const targetX = 800 - (centerX * (800 / video.videoWidth));

                    // 切換跑道
                    if (targetX < 266) currentLane = 0;
                    else if (targetX > 533) currentLane = 2;
                    else currentLane = 1;
                }
            }

            if (gameActive) {
                // 題目算式障礙物下落
                obstacleY += obstacleSpeed;

                for (let i = 0; i < 3; i++) {
                    ctx.fillStyle = "#1e90ff";
                    ctx.fillRect(laneXPositions[i] - 50, obstacleY, 100, 50);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 24px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(currentProblem.options[i], laneXPositions[i], obstacleY + 33);
                }

                // 判定碰撞 (車子位於 Y: 500)
                if (obstacleY >= 450 && obstacleY <= 500) {
                    if (currentLane === currentProblem.correctLane) {
                        score += 10;
                    } else {
                        score = Math.max(0, score - 5);
                    }
                    generateProblem();
                } else if (obstacleY > 600) {
                    generateProblem();
                }

                // 畫玩家賽車
                const carX = laneXPositions[currentLane];
                ctx.fillStyle = "#ff4757";
                ctx.shadowColor = "#ff4757";
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(carX, 500, 25, 0, 2 * Math.PI);
                ctx.fill();
                ctx.shadowBlur = 0;

                // UI 顯示
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`題目：${currentProblem.question}`, 400, 45);

                ctx.font = "bold 20px Arial";
                ctx.textAlign = "left";
                ctx.fillText(`得分: ${score}`, 30, 40);
                ctx.fillText(`時間: ${timeLeft}s`, 30, 70);

                requestAnimationFrame(gameLoop);
            } else {
                // 結束結算
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, 800, 600);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("🎉 挑戰結束！", 400, 240);
                ctx.fillText(`最終得分：${score} 分`, 400, 310);

                ctx.font = "20px Arial";
                ctx.fillStyle = "#eccc68";
                ctx.fillText("按 F5 重新整理頁面即可再次挑戰！", 400, 380);
            }
        }
    </script>
</body>
</html>
