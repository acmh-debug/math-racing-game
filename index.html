<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學校園體感賽車 - 極速版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px; height: 600px;
            background: #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas { width: 100%; height: 100%; display: block; }
        #webcam-container {
            position: absolute; top: 15px; right: 15px;
            width: 140px; height: 105px;
            border-radius: 8px; overflow: hidden;
            border: 2px solid #ff4757; background: #000; z-index: 10;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        #start-overlay {
            position: absolute; top: 0; left: 0;
            width: 800px; height: 600px;
            background: rgba(15, 52, 96, 0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 20;
        }
        #start-btn {
            background: #ff4757;
            color: white; border: none;
            padding: 15px 40px; font-size: 24px; font-weight: bold;
            border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s;
        }
        #start-btn:hover { transform: scale(1.05); }
        #loading-text { font-size: 18px; color: #eccc68; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="webcam-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div id="start-overlay">
            <h1 style="font-size: 36px; margin-bottom: 10px;">🏎️ 數學校園體感賽車</h1>
            <p style="color: #a4b0be; margin-bottom: 30px;">透過頭部左右微傾切換跑道，選擇正確答案！</p>
            <button id="start-btn" onclick="startGame()">點擊開始遊戲 🚀</button>
            <div id="loading-text"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let model = null;
        let video = null;

        // 遊戲核心變數
        let score = 0;
        let timeLeft = 60;
        let gameActive = false;
        let currentLane = 1; // 0: 左, 1: 中, 2: 右
        const laneXPositions = [133, 400, 666];

        let currentProblem = { question: "", options: [0, 0, 0], correctLane: 1 };
        let obstacleY = -50;
        let obstacleSpeed = 3.5;
        let statusMsg = "AI 體感載入中...";

        // 體感中心基準點 (自動校準)
        let baseCenterX = null;

        function generateProblem() {
            const a = Math.floor(Math.random() * 15) + 1;
            const b = Math.floor(Math.random() * 15) + 1;
            const isAddition = Math.random() > 0.5;

            const questionText = isAddition ? `${a} + ${b} = ?` : `${Math.max(a, b)} - ${Math.min(a, b)} = ?`;
            const correctAnswer = isAddition ? a + b : Math.max(a, b) - Math.min(a, b);

            const correctLane = Math.floor(Math.random() * 3);
            const options = [0, 0, 0];
            options[correctLane] = correctAnswer;

            for (let i = 0; i < 3; i++) {
                if (i !== correctLane) {
                    let fake;
                    do {
                        fake = correctAnswer + (Math.floor(Math.random() * 9) - 4);
                    } while (fake === correctAnswer || fake < 0 || options.includes(fake));
                    options[i] = fake;
                }
            }

            currentProblem = { question: questionText, options: options, correctLane: correctLane };
            obstacleY = -50;
        }

        async function startGame() {
            document.getElementById('start-overlay').style.display = 'none';

            generateProblem();
            gameActive = true;

            requestAnimationFrame(gameLoop);

            const timer = setInterval(() => {
                if (gameActive && timeLeft > 0) {
                    timeLeft--;
                } else if (timeLeft === 0) {
                    gameActive = false;
                    clearInterval(timer);
                }
            }, 1000);

            try {
                video = document.getElementById('webcam');
                // 超低解析度輸入，極致壓縮運算時間
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 120, height: 90, facingMode: 'user' }, audio: false
                });
                video.srcObject = stream;
                await new Promise(r => video.onloadedmetadata = r);
                video.play();

                statusMsg = "載入極速模型中...";
                model = await blazeface.load();
                statusMsg = "零延遲體感已就緒！";
                
                detectPoseLoop();
            } catch (err) {
                console.error("鏡頭/AI 載入異常: ", err);
                statusMsg = "⚠️ 體感無效（支援鍵盤 ← → 操作）";
                
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') currentLane = Math.max(0, currentLane - 1);
                    if (e.key === 'ArrowRight') currentLane = Math.min(2, currentLane + 1);
                });
            }
        }

        async function detectPoseLoop() {
            if (model && video && video.readyState >= 2) {
                try {
                    const predictions = await model.estimateFaces(video, false, false, 0.2);
                    if (predictions.length > 0) {
                        const face = predictions[0];
                        const currentX = (face.topLeft[0] + face.bottomRight[0]) / 2;

                        // 設定初始中心參考點
                        if (baseCenterX === null) {
                            baseCenterX = currentX;
                        }

                        // 計算相對偏移量 (鏡像處理)
                        const deltaX = baseCenterX - currentX;

                        // 敏捷閾值觸發切換：稍微向左/右傾斜 12px 即可秒切換車道
                        if (deltaX < -12) {
                            currentLane = 0; // 左車道
                        } else if (deltaX > 12) {
                            currentLane = 2; // 右車道
                        } else {
                            currentLane = 1; // 中車道
                        }
                    }
                } catch (e) {
                    console.error(e);
                }
            }
            if (gameActive) {
                requestAnimationFrame(detectPoseLoop);
            }
        }

        function gameLoop() {
            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, 0, 800, 600);

            ctx.strokeStyle = "#eccc68";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(266, 0); ctx.lineTo(266, 600);
            ctx.moveTo(533, 0); ctx.lineTo(533, 600);
            ctx.stroke();

            if (gameActive) {
                obstacleY += obstacleSpeed;

                for (let i = 0; i < 3; i++) {
                    ctx.fillStyle = "#1e90ff";
                    ctx.fillRect(laneXPositions[i] - 50, obstacleY, 100, 50);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 24px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(currentProblem.options[i], laneXPositions[i], obstacleY + 33);
                }

                if (obstacleY >= 450 && obstacleY <= 500) {
                    if (currentLane === currentProblem.correctLane) {
                        score += 10;
                    } else {
                        score = Math.max(0, score - 5);
                    }
                    generateProblem();
                } else if (obstacleY > 600) {
                    generateProblem();
                }

                const carX = laneXPositions[currentLane];
                ctx.fillStyle = "#ff4757";
                ctx.shadowColor = "#ff4757";
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(carX, 500, 25, 0, 2 * Math.PI);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`題目：${currentProblem.question}`, 400, 45);

                ctx.font = "16px Arial";
                ctx.fillStyle = "#eccc68";
                ctx.fillText(statusMsg, 400, 75);

                ctx.font = "bold 20px Arial";
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "left";
                ctx.fillText(`得分: ${score}`, 30, 40);
                ctx.fillText(`時間: ${timeLeft}s`, 30, 70);

                requestAnimationFrame(gameLoop);
            } else {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, 800, 600);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("🎉 挑戰結束！", 400, 240);
                ctx.fillText(`最終得分：${score} 分`, 400, 310);

                ctx.font = "20px Arial";
                ctx.fillStyle = "#eccc68";
                ctx.fillText("按 F5 重新整理頁面即可再次挑戰！", 400, 380);
            }
        }
    </script>
</body>
</html>
