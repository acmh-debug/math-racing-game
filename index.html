<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學校園體感賽車</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px; height: 600px;
            background: #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas { width: 100%; height: 100%; display: block; }
        #webcam-container {
            position: absolute; top: 15px; right: 15px;
            width: 160px; height: 120px;
            border-radius: 8px; overflow: hidden;
            border: 2px solid #ff4757; background: #000; z-index: 10;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="webcam-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let model, video;
        let debugMessage = "系統初始化中...";

        function drawScene() {
            // 背景
            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, 0, 800, 600);

            // 跑道線
            ctx.strokeStyle = "#eccc68";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(266, 0); ctx.lineTo(266, 600);
            ctx.moveTo(533, 0); ctx.lineTo(533, 600);
            ctx.stroke();

            // 狀態文字
            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Arial";
            ctx.textAlign = "center";
            ctx.fillText(debugMessage, 400, 40);
        }

        async function init() {
            drawScene();
            
            try {
                video = document.getElementById('webcam');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 320, height: 240, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                debugMessage = "鏡頭已啟動，正在載入 BlazeFace 模型...";
                model = await blazeface.load();
                debugMessage = "模型載入完成！正在搜尋人臉...";
                
                requestAnimationFrame(detectLoop);
            } catch (err) {
                debugMessage = "⚠️ 發生錯誤: " + err.message;
                drawScene();
            }
        }

        async function detectLoop() {
            if (model && video) {
                try {
                    // estimateFaces 回傳預測結果
                    const predictions = await model.estimateFaces(video, false, false, 0.3);

                    drawScene();

                    if (predictions.length > 0) {
                        const face = predictions[0];
                        // 取得邊界框
                        const start = face.topLeft;
                        const end = face.bottomRight;

                        // 計算中心點 (鏡像)
                        const centerX = (start[0] + end[0]) / 2;
                        const centerY = (start[1] + end[1]) / 2;

                        const targetX = 800 - (centerX * (800 / video.videoWidth));
                        const targetY = centerY * (600 / video.videoHeight);

                        // 畫紅點
                        ctx.fillStyle = "#ff4757";
                        ctx.shadowColor = "#ff4757";
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(targetX, targetY, 25, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        debugMessage = `✅ 已成功捕捉頭部！ (X: ${Math.round(targetX)}, Y: ${Math.round(targetY)})`;
                    } else {
                        debugMessage = "🔍 搜尋中：未在鏡頭中辨識到人臉，請面向光線充足處";
                    }
                } catch (e) {
                    debugMessage = "偵測過程發生異常: " + e.message;
                }
            }

            requestAnimationFrame(detectLoop);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
