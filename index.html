<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小六分數小數互化體感賽車</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px; height: 600px;
            background: #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas { width: 100%; height: 100%; display: block; }
        #webcam-container {
            position: absolute; top: 15px; right: 15px;
            width: 140px; height: 105px;
            border-radius: 8px; overflow: hidden;
            border: 2px solid #ff4757; background: #000; z-index: 10;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 800px; height: 600px;
            background: rgba(15, 52, 96, 0.96);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 20; padding: 20px;
        }
        .form-group {
            display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center;
        }
        input, select {
            padding: 8px 12px; font-size: 16px; border-radius: 8px;
            border: 2px solid #1e90ff; background: #16213e; color: white;
            outline: none; text-align: center;
        }
        .btn {
            background: #ff4757; color: white; border: none;
            padding: 12px 35px; font-size: 22px; font-weight: bold;
            border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        
        table {
            width: 95%; border-collapse: collapse; margin-top: 10px;
            background: #16213e; border-radius: 8px; overflow: hidden; font-size: 14px;
        }
        th, td { padding: 6px 10px; text-align: center; border-bottom: 1px solid #0f3460; }
        th { background: #1e90ff; color: white; }

        #recalibrate-btn {
            position: absolute; bottom: 15px; right: 15px;
            background: #1e90ff; color: white; border: none;
            padding: 8px 15px; border-radius: 20px; font-weight: bold;
            cursor: pointer; z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="webcam-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <button id="recalibrate-btn" onclick="recalibrateCenter()">🎯 校準頭部位置</button>

        <!-- 設定與啟動頁面 -->
        <div id="start-overlay" class="overlay">
            <h1 style="font-size: 30px; margin-bottom: 5px; color: #eccc68;">🏎️ 小六分數小數互化體感賽車</h1>
            <p style="color: #a4b0be; margin-bottom: 15px;">分母 2, 4, 5, 8 專題練習｜校準啟動 & 錯題補答版</p>
            
            <div class="form-group">
                <input type="text" id="student-class" placeholder="班別 (例: 6A)" style="width: 120px;">
                <input type="text" id="student-name" placeholder="學生姓名" style="width: 140px;">
            </div>

            <!-- 車款與顏色選擇 -->
            <div class="form-group">
                <label style="align-self: center; font-weight: bold;">賽車款式：</label>
                <select id="car-style">
                    <option value="classic">🏎️ 經典超跑</option>
                    <option value="cyber">⚡ 概念極速車</option>
                    <option value="armored">🛡️ 裝甲賽車</option>
                </select>

                <label style="align-self: center; font-weight: bold; margin-left: 10px;">車身顏色：</label>
                <select id="car-color">
                    <option value="#ff4757">❤️ 經典紅</option>
                    <option value="#1e90ff">💙 炫光藍</option>
                    <option value="#2ed573">💚 疾速綠</option>
                    <option value="#ff6b81">💖 櫻花粉</option>
                </select>
            </div>

            <button class="btn" onclick="startGame()" style="margin-top: 10px;">點擊發動引擎 🚀</button>
            <div id="loading-text" style="color: #eccc68; margin-top: 10px;"></div>
        </div>

        <!-- 英雄榜頁面 -->
        <div id="end-overlay" class="overlay" style="display: none;">
            <h2 style="font-size: 28px; margin: 0 0 5px 0; color: #ff4757;">🎉 挑戰結束！</h2>
            <p id="final-score-text" style="font-size: 20px; margin-bottom: 10px;"></p>
            
            <h3 style="margin: 5px 0; color: #eccc68;">🏆 班級英雄榜 (Top 10)</h3>
            <div style="max-height: 280px; overflow-y: auto; width: 100%; display: flex; justify-content: center;">
                <table id="leaderboard-table">
                    <thead>
                        <tr><th>名次</th><th>日期</th><th>班別</th><th>姓名</th><th>得分</th></tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>

            <button class="btn" onclick="restartGame()" style="margin-top: 15px;">再次挑戰 🔄</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let model = null, video = null;

        let studentInfo = { name: "", class: "", date: "" };
        let selectedCarColor = "#ff4757";
        let selectedCarStyle = "classic";

        let score = 0, timeLeft = 60, gameActive = false, isCalibrated = false;
        let currentLane = 1;
        const laneXPositions = [133, 400, 666];

        let currentProblem = { question: "", options: [], correctLane: 1 };
        let obstacleY = -50, obstacleSpeed = 3.2;
        let statusMsg = "請面向鏡頭正中間進行校準...";
        let baseCenterX = null;
        const sensitivityThreshold = 18;

        // 音效系統
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'engine') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.4);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'calibrate') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'finish') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        const fractionData = [
            { frac: "1/2", dec: "0.5" },
            { frac: "1/4", dec: "0.25" }, { frac: "3/4", dec: "0.75" },
            { frac: "1/5", dec: "0.2" }, { frac: "2/5", dec: "0.4" },
            { frac: "3/5", dec: "0.6" }, { frac: "4/5", dec: "0.8" },
            { frac: "1/8", dec: "0.125" }, { frac: "3/8", dec: "0.375" },
            { frac: "5/8", dec: "0.625" }, { frac: "7/8", dec: "0.875" }
        ];

        function recalibrateCenter() {
            baseCenterX = null;
            isCalibrated = false;
            statusMsg = "🎯 正在重新校準正中心...";
        }

        function generateProblem() {
            const isFracToDec = Math.random() > 0.5;
            const target = fractionData[Math.floor(Math.random() * fractionData.length)];

            let questionText, correctAnswer;
            if (isFracToDec) {
                questionText = `${target.frac} = ?`;
                correctAnswer = target.dec;
            } else {
                questionText = `${target.dec} = ?`;
                correctAnswer = target.frac;
            }

            const correctLane = Math.floor(Math.random() * 3);
            const options = ["", "", ""];
            options[correctLane] = correctAnswer;

            for (let i = 0; i < 3; i++) {
                if (i !== correctLane) {
                    let fake;
                    do {
                        const randomItem = fractionData[Math.floor(Math.random() * fractionData.length)];
                        fake = isFracToDec ? randomItem.dec : randomItem.frac;
                    } while (fake === correctAnswer || options.includes(fake));
                    options[i] = fake;
                }
            }

            currentProblem = { question: questionText, options: options, correctLane: correctLane };
            obstacleY = -50;
        }

        async function startGame() {
            initAudio();

            const nameInput = document.getElementById('student-name').value.trim();
            const classInput = document.getElementById('student-class').value.trim();

            if (!nameInput || !classInput) {
                alert("請先輸入『班別』與『學生姓名』！");
                return;
            }

            selectedCarColor = document.getElementById('car-color').value;
            selectedCarStyle = document.getElementById('car-style').value;

            const today = new Date();
            studentInfo = {
                name: nameInput, class: classInput,
                date: `${today.getMonth() + 1}/${today.getDate()}`
            };

            playSound('engine');
            document.getElementById('start-overlay').style.display = 'none';

            score = 0; timeLeft = 60; isCalibrated = false;
            generateProblem();

            requestAnimationFrame(gameLoop);

            try {
                video = document.getElementById('webcam');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 160, height: 120, facingMode: 'user' }, audio: false
                });
                video.srcObject = stream;
                await new Promise(r => video.onloadedmetadata = r);
                video.play();

                statusMsg = "載入 AI 模型中...";
                model = await blazeface.load();
                statusMsg = "請保持頭部面向正中間進行校準...";
                
                detectPoseLoop();
            } catch (err) {
                console.error(err);
                statusMsg = "⚠️ 體感無效（可用鍵盤 ← → 操作）";
                isCalibrated = true; // 備用模式免校準直接開始
                startTimer();
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') currentLane = Math.max(0, currentLane - 1);
                    if (e.key === 'ArrowRight') currentLane = Math.min(2, currentLane + 1);
                });
            }
        }

        function startTimer() {
            gameActive = true;
            const timer = setInterval(() => {
                if (gameActive && timeLeft > 0) {
                    timeLeft--;
                } else if (timeLeft === 0) {
                    gameActive = false;
                    clearInterval(timer);
                    endGame();
                }
            }, 1000);
        }

        async function detectPoseLoop() {
            if (model && video && video.readyState >= 2) {
                try {
                    const predictions = await model.estimateFaces(video, false, false, 0.2);
                    if (predictions.length > 0) {
                        const face = predictions[0];
                        const currentX = (face.topLeft[0] + face.bottomRight[0]) / 2;

                        if (baseCenterX === null) {
                            baseCenterX = currentX;
                            playSound('calibrate');
                            statusMsg = "✅ 校準成功！比賽開始！";
                            isCalibrated = true;
                            startTimer(); // 校準完成後才開始倒數計時與運算
                        }

                        const deltaX = currentX - baseCenterX;

                        if (deltaX > sensitivityThreshold) currentLane = 0;
                        else if (deltaX < -sensitivityThreshold) currentLane = 2;
                        else currentLane = 1;
                    }
                } catch (e) { console.error(e); }
            }
            if (!gameActive || !isCalibrated) requestAnimationFrame(detectPoseLoop);
            else requestAnimationFrame(detectPoseLoop);
        }

        function drawCar(x, y, color, style) {
            ctx.save();
            ctx.translate(x, y);

            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.ellipse(0, 15, 30, 45, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#111";
            ctx.fillRect(-28, -30, 8, 16);
            ctx.fillRect(20, -30, 8, 16);
            ctx.fillRect(-28, 15, 8, 18);
            ctx.fillRect(20, 15, 8, 18);

            ctx.fillStyle = color;
            ctx.beginPath();
            if (style === 'cyber') {
                ctx.moveTo(0, -45); ctx.lineTo(24, -10); ctx.lineTo(20, 35); ctx.lineTo(-20, 35); ctx.lineTo(-24, -10);
            } else if (style === 'armored') {
                ctx.moveTo(0, -35); ctx.lineTo(26, -20); ctx.lineTo(26, 35); ctx.lineTo(-26, 35); ctx.lineTo(-26, -20);
            } else {
                ctx.moveTo(0, -40); ctx.lineTo(22, -15); ctx.lineTo(22, 35); ctx.lineTo(-22, 35); ctx.lineTo(-22, -15);
            }
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#111";
            ctx.beginPath();
            ctx.moveTo(-12, -10); ctx.lineTo(12, -10); ctx.lineTo(15, 5); ctx.lineTo(-15, 5);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ffda79";
            ctx.beginPath();
            ctx.arc(-14, -35, 4, 0, Math.PI * 2);
            ctx.arc(14, -35, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#222";
            ctx.fillRect(-22, 32, 44, 6);

            ctx.restore();
        }

        function gameLoop() {
            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, 0, 800, 600);

            ctx.strokeStyle = "#eccc68";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(266, 0); ctx.lineTo(266, 600);
            ctx.moveTo(533, 0); ctx.lineTo(533, 600);
            ctx.stroke();

            // 校準未完成前顯示等待動畫與提示
            if (!isCalibrated) {
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(0, 0, 800, 600);

                ctx.fillStyle = "#eccc68";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("🎯 正在校準頭部正中心...", 400, 260);
                ctx.font = "20px Arial";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("請面向螢幕正中間保持不動", 400, 310);

                const carX = laneXPositions[currentLane];
                drawCar(carX, 490, selectedCarColor, selectedCarStyle);
                requestAnimationFrame(gameLoop);
                return;
            }

            if (gameActive) {
                obstacleY += obstacleSpeed;

                for (let i = 0; i < 3; i++) {
                    ctx.fillStyle = "#1e90ff";
                    ctx.fillRect(laneXPositions[i] - 65, obstacleY, 130, 50);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 24px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(currentProblem.options[i], laneXPositions[i], obstacleY + 34);
                }

                // 碰撞與補答判定
                if (obstacleY >= 450 && obstacleY <= 500) {
                    if (currentLane === currentProblem.correctLane) {
                        score += 10;
                        playSound('correct');
                        generateProblem(); // 答對才產生下一題！
                    } else {
                        score = Math.max(0, score - 5);
                        playSound('wrong');
                        obstacleY = -50; // 答錯不換題，方塊重置回頂端要求補答！
                    }
                } else if (obstacleY > 600) {
                    // 超過螢幕沒吃到也算未答對，重置回到頂端
                    obstacleY = -50;
                }

                const carX = laneXPositions[currentLane];
                drawCar(carX, 490, selectedCarColor, selectedCarStyle);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`題目：${currentProblem.question}`, 400, 45);

                ctx.font = "15px Arial";
                ctx.fillStyle = "#eccc68";
                ctx.fillText(statusMsg, 400, 75);

                ctx.font = "bold 18px Arial";
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "left";
                ctx.fillText(`得分: ${score}`, 25, 35);
                ctx.fillText(`時間: ${timeLeft}s`, 25, 65);
                ctx.fillText(`學生: ${studentInfo.class} ${studentInfo.name}`, 25, 95);

                requestAnimationFrame(gameLoop);
            }
        }

        function endGame() {
            playSound('finish');

            saveToLeaderboard({
                name: studentInfo.name, class: studentInfo.class,
                date: studentInfo.date, score: score
            });

            document.getElementById('final-score-text').innerText = `${studentInfo.class} ${studentInfo.name} 最終得分：${score} 分`;
            updateLeaderboardUI();
            document.getElementById('end-overlay').style.display = 'flex';
        }

        function saveToLeaderboard(newEntry) {
            let list = JSON.parse(localStorage.getItem('math_racing_leaderboard') || '[]');
            list.push(newEntry);
            list.sort((a, b) => b.score - a.score);
            list = list.slice(0, 10);
            localStorage.setItem('math_racing_leaderboard', JSON.stringify(list));
        }

        function updateLeaderboardUI() {
            const list = JSON.parse(localStorage.getItem('math_racing_leaderboard') || '[]');
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            list.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.date}</td>
                    <td>${item.class}</td>
                    <td>${item.name}</td>
                    <td style="color:#eccc68; font-weight:bold;">${item.score}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function restartGame() {
            document.getElementById('end-overlay').style.display = 'none';
            document.getElementById('start-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
